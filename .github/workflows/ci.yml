name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# appkit does not commit Gemfile.lock, so each job resolves one first.
jobs:
  scan_ruby:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        id: ruby
        uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current

      - name: Resolve gems
        id: gems
        env:
          RUBY_RELEASE: ${{ steps.ruby.outputs.ruby-version }}
        run: |
          bundle lock
          hash=$(grep -v '^ *appkit (' Gemfile.lock | sha256sum | cut -d' ' -f1)
          prefix="gems-$RUNNER_OS-$RUNNER_ARCH-ruby-$RUBY_RELEASE-"
          {
            echo "hash=$hash"
            echo "cache-prefix=$prefix"
            echo "cache-key=$prefix$hash"
          } >> "$GITHUB_OUTPUT"

      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ steps.gems.outputs.cache-key }}
          restore-keys: ${{ steps.gems.outputs.cache-prefix }}

      - name: Install gems
        run: |
          BUNDLE_PATH=vendor/bundle rv ci
          echo "BUNDLE_PATH=vendor/bundle" >> "$GITHUB_ENV"

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bundle exec brakeman -p test/dummy --no-pager --ignore-config config/brakeman.ignore

      - name: Scan the engine's own app/lib code for security vulnerabilities
        run: bundle exec brakeman -p . --force-scan --no-pager --ignore-config config/brakeman.gem.ignore

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit check --update

  lint:
    runs-on: ubuntu-slim
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        id: ruby
        uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current

      - name: Resolve gems
        id: gems
        env:
          RUBY_RELEASE: ${{ steps.ruby.outputs.ruby-version }}
        run: |
          bundle lock
          hash=$(grep -v '^ *appkit (' Gemfile.lock | sha256sum | cut -d' ' -f1)
          prefix="gems-$RUNNER_OS-$RUNNER_ARCH-ruby-$RUBY_RELEASE-"
          {
            echo "hash=$hash"
            echo "cache-prefix=$prefix"
            echo "cache-key=$prefix$hash"
          } >> "$GITHUB_OUTPUT"

      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ steps.gems.outputs.cache-key }}
          restore-keys: ${{ steps.gems.outputs.cache-prefix }}

      - name: Install gems
        run: |
          BUNDLE_PATH=vendor/bundle rv ci
          echo "BUNDLE_PATH=vendor/bundle" >> "$GITHUB_ENV"

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml') }}-${{ steps.gems.outputs.hash }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bundle exec rubocop -f github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        id: ruby
        uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current

      - name: Resolve gems
        id: gems
        env:
          RUBY_RELEASE: ${{ steps.ruby.outputs.ruby-version }}
        run: |
          bundle lock
          hash=$(grep -v '^ *appkit (' Gemfile.lock | sha256sum | cut -d' ' -f1)
          prefix="gems-$RUNNER_OS-$RUNNER_ARCH-ruby-$RUBY_RELEASE-"
          {
            echo "hash=$hash"
            echo "cache-prefix=$prefix"
            echo "cache-key=$prefix$hash"
          } >> "$GITHUB_OUTPUT"

      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ steps.gems.outputs.cache-key }}
          restore-keys: ${{ steps.gems.outputs.cache-prefix }}

      - name: Install gems
        run: |
          BUNDLE_PATH=vendor/bundle rv ci
          echo "BUNDLE_PATH=vendor/bundle" >> "$GITHUB_ENV"

      - name: Run engine test suite against the dummy app
        run: bundle exec rake test
