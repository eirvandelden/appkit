name: Changelog check

# Fails a pull request whose diff touches the public surface with a lower level than the surface needs.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: spinel-coop/setup-rv@789f43073788bc826ed91610498297012e8e6438
        with:
          ruby-version: current

      - name: Check the declared level
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ruby script/semver/bin/surface --base "$BASE_SHA" --head "$HEAD_SHA"
