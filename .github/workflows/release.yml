name: Release

# Cuts the next semver release from the pending changelog.d fragments.
# Runs are serialised so merge order never decides the version.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Ruby
        uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby script/semver/bin/release
