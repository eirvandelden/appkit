---
# The rules shared by every personal Ruby project. This is a Rails engine, so it stacks the
# Rails layer on the shared one.
inherit_from:
  - .rubocop_todo.yml

inherit_gem:
  rubocop-eirvandelden:
    - config/default.yml
    - config/rails.yml

AllCops:
  TargetRubyVersion: 4.0
  Exclude:
    - "test/dummy/db/schema.rb"
    - "tmp/**/*"

# test/dummy is a generated Rails application, not a test helper. Its boot file requires
# bundler/setup because that is how a Rails app boots.
Packaging/BundlerSetupInTests:
  Exclude:
    - "test/dummy/config/boot.rb"
