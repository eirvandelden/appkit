---
# The rules shared by every personal Ruby project. This is a Rails engine, so it stacks the
# Rails layer on the shared one.
inherit_from:
  - .rubocop_todo.yml

inherit_gem:
  rubocop-eirvandelden:
    - config/default.yml
    - config/rails.yml

AllCops:
  TargetRubyVersion: 4.0
  Exclude:
    - "test/dummy/db/schema.rb"
    - "tmp/**/*"
