---
# Local lefthook configuration for the appkit gem
# Extends the global lefthook.yml from dotfiles

# core.hooksPath is the global hooks directory; syncing would replace its stowed hooks.
no_auto_install: true

# appkit does not commit Gemfile.lock, so a stale local one must be completed
# before it is installed: bundle lock keeps locked versions, rv ci installs them.
migrations:
  commands:
    bundle:
      glob:
        - Gemfile
        - appkit.gemspec
      run: bundle lock && rv ci

pre-commit:
  commands:
    stylelint:
      skip: true
    browserslist:
      skip: true
    # bundle exec: the RuboCop linter inherits rubocop-eirvandelden, a
    # git-sourced gem that only Bundler can load.
    erb_lint:
      run: bundle exec erb_lint {staged_files}
    eslint:
      skip: true
    # No glob: deleting a Ruby file, or editing the Gemfile or the rake task,
    # also changes what sig/ must contain. Checks the staged files only, so
    # unstaged work does not block a commit. Leaves the regenerated sig/ unstaged.
    rbs:
      run: bundle exec rake rbs:check_staged

pre-push:
  commands:
    stylelint:
      skip: true
    browserslist:
      skip: true
    erb_lint:
      run: bundle exec erb_lint {push_files}
    eslint:
      skip: true
    rspec:
      skip: true
    # No bin/brakeman binstub at gem root, and CI already runs it correctly
    # (dummy-app + gem-root scans, proper --ignore-config flags) — a bare
    # pre-push run here would just duplicate CI without that wiring and block
    # on already-handled false positives.
    brakeman:
      skip: true
    bundle-audit:
      glob: "{Gemfile,appkit.gemspec}"
    # No glob: a push that changes only the Steepfile or the Gemfile still needs the check.
    steep:
      run: bundle exec rake steep
