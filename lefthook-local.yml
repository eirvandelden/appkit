---
# Local lefthook configuration for the appkit gem
# Extends the global lefthook.yml from dotfiles

# appkit does not commit Gemfile.lock, so a stale local one must be completed
# before it is installed: bundle lock keeps locked versions, rv ci installs them.
migrations:
  commands:
    bundle:
      glob:
        - Gemfile
        - appkit.gemspec
      run: bundle lock && rv ci

pre-commit:
  commands:
    stylelint:
      skip: true
    browserslist:
      skip: true
    # bundle exec: the RuboCop linter inherits rubocop-eirvandelden, a
    # git-sourced gem that only Bundler can load.
    erb_lint:
      run: bundle exec erb_lint {staged_files}
    eslint:
      skip: true

pre-push:
  commands:
    stylelint:
      skip: true
    browserslist:
      skip: true
    erb_lint:
      run: bundle exec erb_lint {push_files}
    eslint:
      skip: true
    rspec:
      skip: true
    # No bin/brakeman binstub at gem root, and CI already runs it correctly
    # (dummy-app + gem-root scans, proper --ignore-config flags) — a bare
    # pre-push run here would just duplicate CI without that wiring and block
    # on already-handled false positives.
    brakeman:
      skip: true
    bundle-audit:
      glob: "{Gemfile,appkit.gemspec}"
